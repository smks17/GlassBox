name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check Go
        run: |
          go build ./...
          go vet ./...
          go test ./...
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build the WASM engine
        env:
          GOOS: js
          GOARCH: wasm
        run: go build -o web/public/engine.wasm ./cmd/wasm
      - name: Check and build the web app
        working-directory: web
        env:
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL }}
        run: |
          npm ci
          npm run lint
          npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check FastAPI startup
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          export GLASS_DATABASE_PATH="$RUNNER_TEMP/sessions.sqlite3"
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8000/health
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'glass' }}
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID variable}"
          : "${NEXT_PUBLIC_BACKEND_URL:?Set the NEXT_PUBLIC_BACKEND_URL variable}"
          ./node_modules/.bin/wrangler pages deploy out --project-name "$PAGES_PROJECT" --branch main
